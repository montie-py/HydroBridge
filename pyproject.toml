[project]
name = "hydrobridge"
version = "0.1.0"
description = "Read PLC registers over Modbus and publish them as telemetry"
authors = [
    {name = "montiepy"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4"
dependencies = []
keywords = ["modbus", "plc", "iot", "telemetry", "azure", "scada"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
]

[project.urls]
Repository = "https://github.com/montie-py/HydroBridge"
Issues = "https://github.com/montie-py/HydroBridge/issues"

[project.optional-dependencies]
modbus = ["easymodbus (>=2.1.6,<3.0.0)"]
azure = ["azure-iot-device (>=2.14.0,<3.0.0)"]

[tool.poetry]
packages = [{ include = "hydrobridge", from = "src" }]

[build-system]
# 2.2+ writes the PEP 639 license fields (License-Expression, the LICENSE file in the wheel)
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    # same as the extras, so a plain `poetry install` can run the adapters and their tests
    "easymodbus (>=2.1.6,<3.0.0)",
    "azure-iot-device (>=2.14.0,<3.0.0)"
]
# the example application in app/ (not part of the published package)
app = [
    "pydantic (==2.13.5)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project root, so tests can import the example app (app/)
pythonpath = ["."]
markers = [
    "packaging: builds the wheel and installs it into a fresh venv (slower; deselect with -m 'not packaging')",
]
